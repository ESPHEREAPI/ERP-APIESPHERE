spring:
  datasource:
    url: jdbc:mysql://localhost:3306/biometry?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:DeepWater@2021}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  config:
    import: "optional:configserver:"

  cloud:
    compatibility-verifier:
      enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# Serveur biométrie externe legacy (ex serveur PHP "webservice_server")
esphere:
  external-biometry-server:
    base-url: http://35.204.126.17/web_service/public/biometry
  webservice-cron:
    enabled: false
    # Séquence complète (adhérents -> ayants droit -> taux -> désactivations)
    # exécutée 3 fois par jour : 06h30, 18h00, 20h00
    cron-matin: "0 30 6 * * *"
    cron-soir-18h: "0 0 18 * * *"
    cron-soir-20h: "0 0 20 * * *"

logging:
  level:
    com.esphere: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: INFO
