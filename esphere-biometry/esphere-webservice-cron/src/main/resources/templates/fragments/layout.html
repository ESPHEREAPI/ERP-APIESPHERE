<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(titre, contenu)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titre} + ' · ESPHERE Webservice Cron'">ESPHERE Webservice Cron</title>

    <link rel="icon" href="data:,">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark app-navbar sticky-top">
    <div class="container-fluid px-3 px-lg-4">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/webservice/dashboard}">
            <span class="brand-badge"><i class="bi bi-arrow-repeat"></i></span>
            <span>
                <span class="fw-semibold">ESPHERE</span>
                <span class="opacity-75">Webservice Cron</span>
            </span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMain">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0" th:with="actif=${pageActive}">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${actif == 'dashboard'} ? 'active'" th:href="@{/webservice/dashboard}">
                        <i class="bi bi-speedometer2 me-1"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${actif == 'declenchement'} ? 'active'" th:href="@{/webservice/dashboard/declenchement}">
                        <i class="bi bi-play-circle me-1"></i>Declenchement manuel
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${actif == 'police'} ? 'active'" th:href="@{/webservice/dashboard/police}">
                        <i class="bi bi-search me-1"></i>Statut police
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${actif == 'polices'} ? 'active'" th:href="@{/webservice/dashboard/polices}">
                        <i class="bi bi-grid-3x3-gap me-1"></i>Toutes les polices
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${actif == 'historique'} ? 'active'" th:href="@{/webservice/dashboard/historique}">
                        <i class="bi bi-clock-history me-1"></i>Historique
                    </a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/webservice}" target="_blank">
                        <i class="bi bi-filetype-json me-1"></i>Guide API
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/swagger-ui/index.html}" target="_blank">
                        <i class="bi bi-box-arrow-up-right me-1"></i>Swagger
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container-fluid app-main py-4 px-3 px-lg-4">
    <div th:replace="${contenu}"></div>
</main>

<footer class="text-center text-muted small py-4 app-footer">
    ESPHERE Webservice Cron &middot; synchronisation automatique 06h30 / 18h00 / 20h00
</footer>

<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
